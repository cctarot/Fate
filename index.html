<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你和他還有沒完成的緣分嗎？</title>
<style>
  @import url('https://googleapis.com');
  :root {
    --bg1: #fff0f5; --bg2: #ffd1dc; --bg3: #fbcce7; --ink: #5a3d54; --ink-soft: #926e88; --amber: #b55d75; --gold: #e0a96d; --gold-l: #f7d6b5;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    color: var(--ink); min-height: 100vh; padding: 40px 20px; text-align: center;
  }
  .hero-logo { width: 180px; height: auto; margin: 0 auto 15px; display: block; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); }
  .hero-badge { display: inline-block; background: rgba(255,255,255,0.65); border: 1px solid rgba(217,116,143,0.3); border-radius: 99px; padding: 6px 18px; font-size: 13px; color: var(--ink-soft); margin-bottom: 20px; }
  .hero-title { font-family: 'Noto Serif TC', serif; font-size: clamp(28px, 6vw, 48px); font-weight: 900; line-height: 1.3; margin-bottom: 15px; }
  .hero-title span { display: block; background: linear-gradient(135deg, #a64470, #cc5a8f, #e09267); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-sub { font-size: 15px; color: var(--ink-soft); line-height: 1.7; max-width: 480px; margin: 0 auto 40px; }
  .section-title { font-family: 'Noto Serif TC', serif; font-size: 24px; margin-bottom: 30px; }
  .cards-row { display: flex; gap: 15px; justify-content: center; max-width: 600px; margin: 0 auto 40px; }
  .tarot-card { width: 30%; aspect-ratio: 1/1.6; cursor: pointer; perspective: 1000px; }
  .card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 12px; }
  .tarot-card.flipped .card-inner { transform: rotateY(180deg); }
  .card-back, .card-face { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .card-back { background: linear-gradient(145deg, #3d2336, #20132b); border: 1.5px solid rgba(230,184,210,0.4); color: var(--gold-l); }
  .card-back .glyph { font-size: 28px; margin-bottom: 5px; }
  .card-face { transform: rotateY(180deg); background: linear-gradient(155deg, #421e33, #1d122b); border: 1.5px solid var(--gold); }
  .card-face .icon { font-size: 24px; margin-bottom: 5px; }
  .card-face .letter { font-family: 'Noto Serif TC', serif; font-size: 28px; font-weight: 900; color: var(--gold); }
  .answer-section { display: none; max-width: 650px; margin: 0 auto; text-align: left; background: rgba(255,255,255,0.9); border-radius: 16px; padding: 30px; border: 1px solid rgba(217,116,143,0.2); box-shadow: 0 15px 40px rgba(0,0,0,0.05); }
  .answer-section h2 { font-family: 'Noto Serif TC', serif; text-align: center; color: var(--amber); margin-bottom: 20px; font-size: 22px; }
  .answer-section h3 { font-family: 'Noto Serif TC', serif; color: var(--amber); margin: 20px 0 8px; font-size: 17px; border-left: 3px solid var(--amber); padding-left: 8px; }
  .answer-section h3:first-of-type { margin-top: 0; }
  .answer-section p { font-size: 14.5px; line-height: 1.8; color: var(--ink); margin-bottom: 12px; text-align: justify; }
  .answer-section p:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<section class="hero">
  <!-- 👁️ 這裡已替換成您正確的紫色兜帽占卜師 LOGO 網路連結了！ -->
  <img src="https://nano-banana.com" alt="LOGO" class="hero-logo">
  <div class="hero-badge">✦ 靈魂共鳴 ‧ 線上神諭占卜 ✦</div>
  <h1 class="hero-title">命運交織的軌跡<br><span>你和他還有沒完成的緣分嗎？</span></h1>
  <p class="hero-sub">閉上雙眼，默念對方的名字三次，憑第一直覺挑選神秘字母。塔羅牌陣將為你揭示未竟的緣分與真實的指引。</p>
</section>

<section class="pick-section">
  <h2 class="section-title">🔮 請憑直覺抽取一張神諭</h2>
  <div class="cards-row">
    <div class="tarot-card" onclick="flipCard(this, 'A')">
      <div class="card-inner"><div class="card-back"><div class="glyph">✨</div><div class="label">A</div></div><div class="card-face"><div class="icon">⚔️</div><div class="letter">A</div></div></div>
    </div>
    <div class="tarot-card" onclick="flipCard(this, 'B')">
      <div class="card-inner"><div class="card-back"><div class="glyph">🌙</div><div class="label">B</div></div><div class="card-face"><div class="icon">💖</div><div class="letter">B</div></div></div>
    </div>
    <div class="tarot-card" onclick="flipCard(this, 'C')">
      <div class="card-inner"><div class="card-back"><div class="glyph">🌟</div><div class="label">C</div></div><div class="card-face"><div class="icon">⏳</div><div class="letter">C</div></div></div>
    </div>
  </div>
</section>

<section class="answer-section" id="answer-box"></section>

<script>
  const tarotAnswers = {
    'A': `<h2>✦ A組解析 ✦</h2>
          <h3>1. 從並肩作戰到沉默冷場</h3>
          <p>你們過去的關係非常緊密，就像是並肩作戰的夥伴，在生活與工作上能夠相輔相成、互相協助，緣分基礎深厚。然而，成為親密關係後，你們開始察覺彼此有些想法上的差異，卻因為太了解對方，反而覺得「溝通」成了最困難的事，導致雙方選擇沉默，進而讓關係逐漸冷場、轉淡。</p>
          <h3>2. 「介入者」與隱性的內耗</h3>
          <p>這段感情中存在著某種「第三者」，但不一定是實質的小三，更有可能是一場突發事件、或是某個外在契機介入了你們的關係，成為阻礙前行的絆腳石。因為有一方過於單純地看待問題而導致吃虧，或是雙方在包容過程中產生了過度的「內耗 Hoff」與負能量，且對方似乎一直不願意開誠布公地溝通，使得問題懸而未決。</p>
          <h3>3. 指引與結論：各自圓滿，未必糾結於在一起</h3>
          <p><b>如果你們還有聯絡：</b>若雙方仍有互動與關心，那麼緣分是有機會重新開啟的，但前提是必須突破「不願溝通」的僵局。</p>
          <p><b>如果你們已無聯繫：</b>指引牌顯示，你們各自在沒有對方之後，生活反而顯得更加和諧與圓滿。你們都具備讓自己過得很好的能力，而這份關係的真正意義，在於它是你們人生中的「指路標」，陪伴彼此成長。</p>
          <p><b>最終建議：</b>脫離這段曾帶有束縛感的感情後，你們正迎向光亮。如果無法解決溝通問題，試著將對方視為人生中不可或缺的貴人，感謝彼此帶來的成長，讓事情圓滿落幕。未來的生活會過得很美好，將這份緣分昇華為美好的回憶，或許就是對雙方最好的結局。</p>`,
          
    'B': `<h2>✦ B組解析 ✦</h2>
          <h3>緣分深厚且圓滿，將偏愛留給彼此</h3>
          <p>抽到 B 組的朋友們非常幸運，你們之間的緣分不僅沒有斷掉，還呈現相當圓滿的狀態。對方的慷慨與大方雖然對大家都很好，但他懂得拿捏界線，並把真正的「偏愛」獨獨留給你。雙方在社交與資源上也能互相支援、並肩作戰，甚至已經見過雙方家長且獲得長輩的滿意與支持，感情基礎相當穩固。</p>
          <h3>未完成的緣分：過於理性與拉不下臉的考驗</h3>
          <p>既然各方面都很好，為什麼還會有「未完成的緣分」呢？指引牌指出，當面臨重大事件或需要做長遠規劃（例如步入婚姻）時，有一方可能會瞬間變得非常理性、謹慎，甚至讓人感覺有些抽離、抓不住真實情緒。</p>
          <p>此外，雙方在某些時候可能會因為「拉不下臉」而卡住。如果你們目前處於失聯或分開的狀態，雖然當初分開的理由在當時無法改變，但隨著雙方各自成長，未來是有很高機率可以再次續緣的。</p>
          <h3>塔羅指引：學會接納感情中的小瑕疵</h3>
          <p>指引牌提醒你，這段關係的起點到終點都很不錯，但你必須允許感情裡存在一些小瑕疵。不需要追求百分之百的完美，學會包容對方在關鍵時刻的過度理性與木訥，並放下偶爾的硬脾氣。無論是正在穩穩交往、準備邁向下個階段，或是曾經分開如今各自成長，你們之間那份深刻的緣分都依然閃閃發光，只要願意溝通與包容，美好結局絕對值得期待！</p>`,
          
    'C': `<h2>✦ C組解析 ✦</h2>
          <h3>1. 努力已到極限，緣分已走到盡頭</h3>
          <p>抽到 C 組的朋友，你們之間的緣分已經來到了終點。這段感情你們都曾非常努力過，但也因此感到精疲力竭。即便透過塔羅牌、占卜或合八字等方式尋求解答，也無法改變已經發生的事實。你們不得不分開，這份無法繼續的失落與不甘心，往往伴隨著極高的情緒拉扯，讓人難以接受。</p>
          <h3>2. 欺騙與貪心毀掉了過往的努力</h3>
          <p>牌面顯示，這段關係中可能存在著欺騙、一時的糊塗或貪心，徹底摧毀了你們累積的信任。如果當初是因為這些原因而分開，這段感情真的沒有必要再去挽回或糾纏。因為如果你選擇回到這段關係裡，很可能會再次經歷當初的心碎與傷痛。</p>
          <h3>3. 塔羅指引：緣分已盡，別再勉強失去自我</h3>
          <p>指引牌明白告訴你：你們之間已經沒有未竟的緣分，也沒有空間朝同一個目標前進了。</p>
          <p>過去的努力已經消耗了你們大量的時間、精力，甚至讓你失去了原本的原則與自我。雖然心裡可能還有一絲糾結，但牌面給出的忠告是：「你們雖然有緣分，但我建議你不要繼續。」 放過彼此、停止內耗，別讓過度的執著成為折磨自己的枷鎖。</p>`
  };

  function flipCard(card, id) {
    if(document.querySelector('.tarot-card.flipped')) return;
    card.classList.add('flipped');
    setTimeout(() => {
      const box = document.getElementById('answer-box');
      box.innerHTML = tarotAnswers[id];
      box.style.display = 'block';
      box.scrollIntoView({ behavior: 'smooth' });
    }, 400);
  }
</script>
</body>
</html>
