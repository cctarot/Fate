<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你和他還有沒完成的緣分嗎？</title>
<style>
  @import url('https://googleapis.com');

  /* 🎨 粉色系底色設定 */
  :root {
    --bg1:        #fff0f5; 
    --bg2:        #ffd1dc; 
    --bg3:        #fbcce7; 
    --ink:        #5a3d54; 
    --ink-soft:   #926e88; 
    --amber:      #b55d75; 
    --amber-l:    #d9748f; 
    --gold:       #e0a96d; 
    --gold-l:     #f7d6b5; 
    --lilac:      #e6b8d2; 
    --white:      #ffffff;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
  }

  #stars-canvas {
    position: fixed; top:0; left:0;
    width:100%; height:100%;
    pointer-events: none;
    z-index: 0;
  }

  section { position: relative; z-index: 1; }

  .hero {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px 40px;
    text-align: center;
  }

  /* 👁️ LOGO 樣式設定：寬度 160 像素、置中、帶有精緻陰影 */
  .hero-logo {
    width: 160px;
    height: auto;
    margin-bottom: 20px;
    display: block;
    filter: drop-shadow(0 6px 12px rgba(90,61,84,0.15));
  }

  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(217,116,143,0.35);
    border-radius: 999px;
    padding: 8px 22px;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--ink-soft);
    margin-bottom: 24px;
  }

  .hero-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(32px, 7vw, 54px);
    font-weight: 900;
    line-height: 1.4;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .hero-title .line2 {
    display: block;
    background: linear-gradient(135deg, #a64470, #cc5a8f, #e09267);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: 16px; color: var(--ink-soft);
    line-height: 1.8; max-width: 480px;
    margin-bottom: 48px;
  }

  .scroll-hint {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--ink-soft); font-size: 13px; letter-spacing: 2px;
  }
  .scroll-hint .arrow {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--ink-soft), transparent);
  }

  .pick-section {
    padding: 80px 24px;
    display: flex; flex-direction: column;
    align-items: center;
  }

  .section-label {
    font-size: 11px; letter-spacing: 5px;
    color: var(--amber); text-transform: uppercase;
    margin-bottom: 12px;
  }

  .section-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }

  .section-desc {
    color: var(--ink-soft); font-size: 15px;
    text-align: center; max-width: 480px;
    line-height: 1.8; margin-bottom: 56px;
  }

  .cards-row {
    display: flex; gap: 12px; justify-content: center;
    flex-wrap: nowrap; width: 100%;
    max-width: 700px;
    padding: 0 8px;
  }

  .tarot-card {
    width: clamp(95px, 28vw, 180px);
    cursor: pointer;
    perspective: 1000px;
    flex-shrink: 0;
  }

  .card-inner {
    position: relative;
    width: 100%; padding-bottom: 160%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
    border-radius: 16px;
  }

  .tarot-card:hover:not(.flipped) .card-inner {
    transform: translateY(-12px) rotateY(15deg);
  }
  .tarot-card.flipped .card-inner {
    transform: rotateY(180deg);
  }

  .card-face, .card-back {
    position: absolute; inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .card-back {
    background: linear-gradient(145deg, #3d2336, #20132b);
    border: 1.5px solid rgba(230,184,210,0.4);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    box-shadow: 0 0 30px rgba(181,93,117,0.3), inset 0 0 40px rgba(0,0,0,0.3);
  }

  .card-back::before {
    content: '';
    position: absolute; inset: 8px;
    border: 1px solid rgba(230,184,210,0.2);
    border-radius: 10px;
  }

  .card-glyph {
    font-size: 42px;
    filter: drop-shadow(0 0 12px rgba(217,116,143,0.8));
  }

  .card-label {
    font-family: 'Noto Serif TC', serif;
    font-size: 22px; font-weight: 900;
    color: var(--gold-l);
    text-shadow: 0 0 20px rgba(224,169,109,0.8);
    letter-spacing: 4px;
  }

  .card-hint {
    font-size: 11px; color: var(--lilac);
    letter-spacing: 2px;
  }

  .card-face {
    transform: rotateY(180deg);
    background: linear-gradient(155deg, #421e33, #1d122b, #301326);
    border: 1.5px solid rgba(224,169,109,0.5);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 40px rgba(224,169,109,0.3);
  }
  .card-face-content {
    text-align: center; padding: 20px 12px;
  }
  .card-face-icon { font-size: 36px; margin-bottom: 10px; }
  .card-face-letter {
    font-family: 'Noto Serif TC', serif;
    font-size: 48px; font-weight: 900;
    background: linear-gradient(135deg, var(--gold), var(--gold-l));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .card-face-sub { font-size: 12px; color: var(--lilac); margin-top: 6px; letter-spacing: 2px; }

  .answer-section {
    padding: 0 24px 80px;
    max-width: 720px; margin: 0 auto;
    opacity: 0; transform: translateY(40px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    display: none;
  }
  .answer-section.visible {
    opacity: 1; transform: translateY(0);
    display: block;
  }

  .answer-header {
    text-align: center; margin-bottom: 40px;
  }

  .answer-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, rgba(181,93,117,0.18), rgba(181,93,117,0.06));
    border: 1px solid rgba(181,93,117,0.45);
    border-radius: 999px;
    padding: 8px 20px; font-size: 13px;
    color: var(--amber); letter-spacing: 2px;
    margin-bottom: 20px;
  }

  .answer-title {
    font-family: 'Noto Serif TC', serif;
    font-size: clamp(26px, 6vw, 42px);
    font-weight: 900; line-height: 1.3;
    margin-bottom: 8px;
    text-align: center;
  }
  .answer-title .choice {
    background: linear-gradient(135deg, var(--amber), var(--amber-l));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .answer-card {
    background: linear-gradient(145deg, rgba(255,255,255,0.85), rgba(255,245,250,0.75));
    border: 1px solid rgba(217,116,143,0.3);
    border-radius: 20px;
    padding: 36px 32px;
    margin-bottom: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(217,116,143,0.15), inset 0 1px 0 rgba(255,255,255,0.7);
    line-height: 1.9; font-size: 15px; color: var(--ink);
    position: relative; overflow: hidden;
  }
  .answer-card::before {
    content: '';
    position: absolute; top:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
  }
  .answer-card p { margin-bottom: 18px; }
  .answer-card p:last-child { margin-bottom: 0; }
  .answer-card h3 { font-size: 18px; color: var(--amber); margin: 24px 0 10px 0; font-family: 'Noto Serif TC', serif; }
  .answer-card h3:first-child { margin-top: 0; }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<section class="hero">
  <!-- 👁️ 終極大絕招：已將你的可愛占卜師角色直接轉換為純代碼內嵌，百分之百保證出現圖片！ -->
